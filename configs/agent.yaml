agent_name: "ai_field_engineer_reasoning_agent"
version: "1.0.0"

llm:
  provider: "mock"
  model_name: "gpt-4o-mini"
  api_key_env_var: "OPENAI_API_KEY"
  temperature: 0.0
  max_tokens: 2048
  timeout_seconds: 30.0
  max_retries: 3
  retry_delay_seconds: 1.0

reasoning:
  max_reasoning_steps: 5
  max_hypotheses: 4
  enable_contradiction_detection: true
  enable_groundedness_check: true
  groundedness_threshold: 0.60
  allow_active_investigation: true
  max_tool_calls: 5

retrieval_tool:
  default_top_k: 3
  min_similarity_threshold: 0.15
  max_context_chars: 2500

enabled_tools:
  - "retrieve_technical_evidence"
  - "inspect_sensor_state"
  - "check_iso_vibration_limits"
