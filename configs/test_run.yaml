experiment_name: "test_smoke_run"

system:
  device: "cpu"
  seed: 42
  deterministic: true
  num_workers: 0
  pin_memory: false
  output_dir: "experiments/outputs"
  checkpoint_dir: "checkpoints"
  log_level: "INFO"

dataset:
  name: "fashion_mnist"
  data_dir: "data/raw"
  image_size: 224
  val_split: 0.15
  num_classes: 10

model:
  name: "mobilenet_v2"
  num_classes: 10
  pretrained: false
  freeze_backbone: true
  dropout: 0.2

training:
  batch_size: 128
  epochs: 1
  learning_rate: 0.001
  weight_decay: 0.0001
  optimizer: "adamw"
  scheduler: "none"
  mixed_precision: false
  early_stopping_patience: 1
  gradient_clip_val: 1.0
