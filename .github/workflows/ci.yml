name: CI/CD Pipeline - AI Field Engineer

on:
  push:
    branches: [ "main", "develop" ]
  pull_request:
    branches: [ "main", "develop" ]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  code-quality:
    name: Linting, Formatting & Type Checking
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: "pip"

      - name: Install Development Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install ruff mypy types-PyYAML types-requests

      - name: Run Ruff Linter & Formatter Check
        run: |
          ruff check src/ tests/
          ruff format --check src/ tests/

      - name: Run Static Type Checking (mypy)
        run: |
          mypy src/api/ src/agent/ src/rag/config.py src/explainability/core/schema.py

  automated-tests:
    name: Multimodal Unit & Integration Tests
    runs-on: ubuntu-latest
    needs: code-quality
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: "pip"

      - name: Install Runtime & Test Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install torch torchvision --index-url https://download.pytorch.org/whl/cpu
          pip install -r requirements-dev.txt

      - name: Execute Full Test Suite (Phases 1-10)
        env:
          ENVIRONMENT: test
          LLM_PROVIDER: mock
        run: |
          python -m pytest tests/ -v --cov=src --cov-report=term-missing --cov-report=xml

      - name: Upload Test Coverage
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: coverage-report
          path: coverage.xml
          retention-days: 7

  docker-build-and-smoke:
    name: Docker Build & Container Smoke Test
    runs-on: ubuntu-latest
    needs: automated-tests
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build Docker Image
        uses: docker/build-push-action@v5
        with:
          context: .
          file: ./Dockerfile
          push: false
          tags: |
            ai-field-engineer-api:latest
            ai-field-engineer-api:${{ github.sha }}
          load: true
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Launch Container for Smoke Validation
        run: |
          docker run -d --name test_api \
            -p 8000:8000 \
            -e ENVIRONMENT=test \
            -e GIT_SHA=${{ github.sha }} \
            -e LLM_PROVIDER=mock \
            ai-field-engineer-api:${{ github.sha }}

      - name: Wait for Container Readiness
        run: |
          timeout 30 bash -c 'until curl -s -f http://127.0.0.1:8000/health; do sleep 1; done'
          timeout 30 bash -c 'until curl -s -f http://127.0.0.1:8000/ready; do sleep 1; done'

      - name: Execute Smoke Test API Request
        run: |
          curl -X POST http://127.0.0.1:8000/api/v1/diagnose \
            -F 'technician_description=High pitch squeal and casing temperature elevated to 88C' \
            -F 'sensor_data={"temperature": 88.0, "vibration": 7.4, "rpm": 1490.0}' \
            -F 'equipment_metadata={"equipment_type": "motor", "manufacturer": "Siemens"}' \
            -s -o /tmp/response.json
          cat /tmp/response.json
          grep -q "primary_diagnosis" /tmp/response.json

      - name: Cleanup Test Container
        if: always()
        run: |
          docker stop test_api || true
          docker rm test_api || true
